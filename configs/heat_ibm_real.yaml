experiment: heat

model:
  n: 16
  nx: 4

optimizer:
  max_iter: 200
  alpha: 70
  use_backtracking: true
  armijo_c: 1e-6
  backtracking_tau: 0.5
  min_step: 1e-10
  max_backtracks: 50

solver:
  mode: hybrid

quantum:
  backend_mode: ibm
  shots: 4096
  ibm_backend_name: null
  ibm_use_least_busy: true

scaling:
  sizes: [4, 8]
  iterations: 1

plots:
  show_solution: true
  show_scaling: false
  show_superimposed_histories: false
  output_dir: output/heat/ibm_real
